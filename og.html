<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>og card source</title>
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #fff;
    background: linear-gradient(135deg, #134e4a 0%, #0f766e 70%, #14b8a6 100%);
    position: relative;
  }
  .grid {
    position: absolute; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,.06) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(255,255,255,.06) 1px, transparent 1px);
    background-size: 60px 60px;
  }
  .card { position: absolute; inset: 0; padding: 64px 72px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .mark { width: 64px; height: 64px; border-radius: 16px; background: #fff; color: #0f766e; font: 700 34px ui-monospace, SFMono-Regular, Menlo, monospace; display: flex; align-items: center; justify-content: center; }
  .site { font-size: 30px; font-weight: 700; letter-spacing: -0.01em; }
  h1 { font-size: 76px; line-height: 1.05; font-weight: 800; letter-spacing: -0.02em; margin: 0; max-width: 1000px; }
  p { font-size: 30px; line-height: 1.35; margin: 22px 0 0; max-width: 980px; color: #ccfbf1; }
  .foot { display: flex; justify-content: space-between; align-items: flex-end; }
  .pill { background: rgba(0,0,0,.22); border-radius: 999px; padding: 10px 20px; font-size: 22px; }
  code { font: 500 26px ui-monospace, SFMono-Regular, Menlo, monospace; background: rgba(255,255,255,.14); padding: 10px 18px; border-radius: 12px; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="card">
    <div class="brand"><div class="mark">{}</div><div class="site">webmcp.org</div></div>
    <div>
      <h1>Let a web page tell an agent what it can do.</h1>
      <p>An unofficial guide to WebMCP: the W3C Community Group draft, where it runs, and what is being built around it.</p>
    </div>
    <div class="foot">
      <span class="pill">Origin trials in Chrome and Edge</span>
      <code>document.modelContext.registerTool()</code>
    </div>
  </div>
</body>
</html>
